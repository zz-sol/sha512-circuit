name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  benchmark:
    runs-on: ubuntu-latest
    needs: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run proof metrics
        run: |
          mkdir -p benchmark-results
          cargo run --release --example proof_metrics > benchmark-results/proof_metrics.json
          cat benchmark-results/proof_metrics.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: proof-metrics
          path: benchmark-results/proof_metrics.json
